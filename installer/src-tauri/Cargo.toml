[package]
name = "betterfy-installer"
version = "0.1.0"
description = "BetterFy Windows installer"
authors = ["BetterFy contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
# Cross-platform, but only its Windows Desktop-dir lookup matters here: it
# resolves the real FOLDERID_Desktop known folder, which OneDrive's Known
# Folder Move can relocate away from `%USERPROFILE%\Desktop`.
dirs = "7"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
mslnk = "0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
