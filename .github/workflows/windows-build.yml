name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: BetterFy NSIS artifact
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VITE_BETTERFY_AUTH_URL: https://betterfy-auth.zori-xyz.workers.dev

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check, build, and test engine
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust engine
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build unsigned Windows installer
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis --config src-tauri/tauri.ci.conf.json
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: BetterFy-Windows-[arch]-[bundle]
