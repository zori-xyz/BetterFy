name: Early Access Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/early-access-release.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"

permissions:
  contents: write

concurrency:
  group: early-access-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build Early Access NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_BETTERFY_AUTH_URL: https://betterfy-auth.zori-xyz.workers.dev

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: npm ci

      - name: Verify frontend and engine
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust engine
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build unsigned NSIS installer
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Prepare fixed release assets
        id: release
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item $installer.FullName "release-assets/BetterFy-Windows-x64-setup.exe"
          $hash = (Get-FileHash "release-assets/BetterFy-Windows-x64-setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BetterFy-Windows-x64-setup.exe" | Set-Content -Encoding ascii "release-assets/BetterFy-Windows-x64-setup.exe.sha256"
          $version = node -p "require('./package.json').version"
          "tag=v$version-ea.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          "title=BetterFy v$version · Early Access ${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Publish immutable Early Access release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" `
            "release-assets/BetterFy-Windows-x64-setup.exe" `
            "release-assets/BetterFy-Windows-x64-setup.exe.sha256" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "$env:RELEASE_TITLE" `
            --notes "Unsigned Early Access installer for Windows testing. Windows may show an unknown publisher warning. Production Dota deployment remains disabled." `
            --prerelease
