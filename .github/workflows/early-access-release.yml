name: Early Access Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/early-access-release.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - "installer/**"

permissions:
  contents: write

concurrency:
  group: early-access-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build Early Access NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_BETTERFY_AUTH_URL: https://betterfy-auth.zori-xyz.workers.dev

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: npm ci

      - name: Verify frontend and engine
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust engine
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Check installer formatting
        run: cargo fmt --all --manifest-path installer/src-tauri/Cargo.toml -- --check

      - name: Lint installer
        run: cargo clippy --locked --manifest-path installer/src-tauri/Cargo.toml -- -D warnings

      # NSIS remains the updater's own artifact format: the signed
      # tauri-plugin-updater config expects a `.nsis.zip`/`.sig` pair, and it
      # runs this exact installer, in passive mode, to apply updates. This
      # build is no longer the user-facing download; see BetterFy Setup below.
      - name: Build unsigned NSIS installer (for the updater)
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Stage the built app as the installer's payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer/src-tauri/payload" | Out-Null
          $binary = Get-ChildItem "src-tauri/target/release/betterfy.exe" -ErrorAction Stop
          Copy-Item $binary.FullName "installer/src-tauri/payload/betterfy.exe"

      - name: Install installer dependencies
        working-directory: installer
        run: npm ci

      - name: Build BetterFy Setup (the branded installer)
        working-directory: installer
        run: npx tauri build

      - name: Prepare fixed release assets
        id: release
        shell: pwsh
        run: |
          $installer = Get-ChildItem "installer/src-tauri/target/release/betterfy-installer.exe" -ErrorAction Stop
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item $installer.FullName "release-assets/BetterFy-Setup.exe"
          $hash = (Get-FileHash "release-assets/BetterFy-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          # -NoNewline plus an explicit `n avoids Set-Content's own CRLF, so
          # `shasum -c` on macOS/Linux accepts this file without stripping
          # CRLF first; PowerShell's Get-FileHash-based verification is fine
          # with a lone LF too.
          Set-Content -Encoding ascii -NoNewline "release-assets/BetterFy-Setup.exe.sha256" "$hash  BetterFy-Setup.exe`n"
          $version = node -p "require('./package.json').version"
          "tag=v$version-ea.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          "title=BetterFy v$version · Early Access ${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Publish immutable Early Access release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" `
            "release-assets/BetterFy-Setup.exe" `
            "release-assets/BetterFy-Setup.exe.sha256" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "$env:RELEASE_TITLE" `
            --notes "Unsigned Early Access installer for Windows testing. BetterFy Setup replaces the NSIS wizard as the user-facing installer; the NSIS artifact remains internal to the signed auto-updater. Windows may show an unknown publisher warning. Live Dota deployment is limited to the pinned internal pilot packages documented in the repository. This build has not yet had its own native Windows verification pass; see installer/README.md." `
            --prerelease
