name: Signed Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "!v*-ea.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: BetterFy signed NSIS release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_BETTERFY_AUTH_URL: https://betterfy-auth.zori-xyz.workers.dev

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: npm ci

      - name: Verify frontend and engine
        run: npm run check

      - name: Build and publish signed updater
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: BetterFy v__VERSION__
          releaseBody: Signed BetterFy Windows installer and in-app update package.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: --bundles nsis

      - name: Publish fixed website installer asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item $installer.FullName "release-assets/BetterFy-Windows-x64-setup.exe"
          $hash = (Get-FileHash "release-assets/BetterFy-Windows-x64-setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          # -NoNewline plus an explicit `n keeps the checksum file LF-only, so
          # `shasum -c` on macOS/Linux accepts it.
          Set-Content -Path "release-assets/BetterFy-Windows-x64-setup.exe.sha256" -Value "$hash  BetterFy-Windows-x64-setup.exe`n" -Encoding ascii -NoNewline
          $version = node -p "require('./package.json').version"
          gh release upload "v$version" `
            "release-assets/BetterFy-Windows-x64-setup.exe" `
            "release-assets/BetterFy-Windows-x64-setup.exe.sha256" `
            --repo "${{ github.repository }}" `
            --clobber

      # The website offers a stable release's BetterFy Setup before its NSIS
      # wizard (services/auth-worker, WINDOWS_INSTALLER_NAMES), as the Early
      # Access workflow does. The payload is the app this run just built.
      - name: Stage the built app as the installer's payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer/src-tauri/payload" | Out-Null
          $binary = Get-ChildItem "src-tauri/target/release/betterfy.exe" -ErrorAction Stop
          Copy-Item $binary.FullName "installer/src-tauri/payload/betterfy.exe"

      - name: Install installer dependencies
        working-directory: installer
        run: npm ci

      - name: Build BetterFy Setup (the branded installer)
        working-directory: installer
        run: npx tauri build

      - name: Publish BetterFy Setup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem "installer/src-tauri/target/release/betterfy-installer.exe" -ErrorAction Stop
          Copy-Item $installer.FullName "release-assets/BetterFy-Setup.exe"
          $hash = (Get-FileHash "release-assets/BetterFy-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "release-assets/BetterFy-Setup.exe.sha256" -Value "$hash  BetterFy-Setup.exe`n" -Encoding ascii -NoNewline
          $version = node -p "require('./package.json').version"
          gh release upload "v$version" `
            "release-assets/BetterFy-Setup.exe" `
            "release-assets/BetterFy-Setup.exe.sha256" `
            --repo "${{ github.repository }}" `
            --clobber
