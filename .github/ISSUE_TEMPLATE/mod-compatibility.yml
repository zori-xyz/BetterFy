name: Mod compatibility report
description: Record how installed packages behaved in Dota 2 on Windows
title: "[Compatibility] "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Use this form for packages installed from BetterFy's Game tuning tab. One report describes one session on one machine: it is evidence for that session, not a general compatibility result.

        A BetterFy success state is not proof that Dota loaded a change; only what you saw in the game is. See the [EA.24 Windows test plan](https://github.com/zori-xyz/BetterFy/blob/main/docs/EA24_WINDOWS_TEST_PLAN.md) for what is already being tested.
  - type: input
    id: version
    attributes:
      label: BetterFy release tag
      description: The exact tag from the Releases page. For an internal CI artifact, give the workflow run URL or commit instead.
      placeholder: v0.1.4-ea.24
    validations:
      required: true
  - type: textarea
    id: packages
    attributes:
      label: Packages in the build
      description: Package names exactly as shown in the app's Game tuning tab, one per line, in build order (first to last).
      placeholder: |
        Tree Mod
        Show NetWorth
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Game language folder
      options:
        - Dutch (dota_dutch)
        - Russian (dota_russian)
        - Korean (dota_koreana)
        - Simplified Chinese (dota_schinese)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed in Dota 2
      description: What you saw in the game yourself, per package. Note anything that did not change, and mark anything reported to you rather than observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What the package should have changed, if it differed from what you saw.
  - type: dropdown
    id: rollback
    attributes:
      label: Rollback
      options:
        - Not attempted
        - Attempted; the game returned to its normal state
        - Attempted; something remained changed or failed
    validations:
      required: true
  - type: textarea
    id: rollback_detail
    attributes:
      label: Rollback details
      description: If rollback failed or left something changed, describe what you saw and any message BetterFy showed.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: In BetterFy, open Settings → Game & files → Diagnostics → Check, expand Technical details, and paste the JSON here. Read it before posting.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, sign-in codes, account identifiers, and personal filesystem paths.
          required: true
