name: Bug report
description: Report a reproducible BetterFy problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us make BetterFy more reliable. Remove tokens, personal paths, Steam account data, and Telegram identifiers from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: BetterFy version
      description: Use the version shown in the application or the workflow artifact name.
      placeholder: 0.3.0 / commit / workflow run
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - macOS development build
        - Browser preview
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Login and Telegram code
        - Dota discovery
        - Catalog or wardrobe
        - Build and verification
        - Steam activation
        - Presets and library
        - Update or installer
        - Theme, layout, or animation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Theme, language, Steam/Dota state, screenshots, and redacted logs can help.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, account identifiers, and personal filesystem paths.
          required: true

