name: Bug report
description: Report a reproducible BetterFy problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make BetterFy more reliable. Remove tokens, sign-in codes, challenge links, personal paths, Steam account data, and Telegram identifiers from logs and screenshots.

        Suspected security problems do not belong here; follow [SECURITY.md](https://github.com/zori-xyz/BetterFy/blob/main/.github/SECURITY.md) instead.
  - type: input
    id: version
    attributes:
      label: Release tag or build
      description: The exact tag from the Releases page, or the workflow run URL or commit for an internal CI artifact.
      placeholder: v0.1.4-ea.24
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - macOS development build
        - Browser preview
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Login and Telegram code
        - Dota discovery
        - Catalog or wardrobe
        - Build and verification
        - Steam activation
        - Presets and library
        - Update or installer
        - Theme, layout, or animation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed result
      description: What you saw yourself. Mark anything that was reported to you rather than observed.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: In BetterFy, open Settings → Game & files → Diagnostics → Check, expand Technical details, and paste the JSON here. The report contains check codes and counts rather than paths or account data; read it before posting anyway.
      render: json
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Theme, language, Steam/Dota state, screenshots, and redacted logs can help.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, sign-in codes, account identifiers, and personal filesystem paths.
          required: true
